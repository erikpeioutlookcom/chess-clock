<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e11">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chess Clock">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Chess Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8e5dd;--fg:#1c1d20;--mut:#6b6e76;--card:#fbfaf7;--line:#cdc9be;--acc:#3a9a3f;--btn:#fff;--bad:#d64535}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0e11;--fg:#e8e9ec;--mut:#8b8f99;--card:#1a1c21;--line:#2f323a;--acc:#58c25e;--btn:#1a1c21}}
:root[data-theme="dark"]{--bg:#0d0e11;--fg:#e8e9ec;--mut:#8b8f99;--card:#1a1c21;--line:#2f323a;--acc:#58c25e;--btn:#1a1c21}
:root{box-sizing:border-box;padding-top:min(env(safe-area-inset-top,0px),8px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
#app{height:100%;display:grid;gap:10px;padding:10px max(10px,env(safe-area-inset-right)) 10px max(10px,env(safe-area-inset-left));grid-template:"b" minmax(0,1fr) "c" auto "w" minmax(0,1fr)/minmax(0,1fr)}
@media (orientation:landscape){#app{grid-template:"w c b" minmax(0,1fr)/minmax(0,1fr) auto minmax(0,1fr)}}
#p0{grid-area:w}#p1{grid-area:b}#bar{grid-area:c}
.panel{container-type:size;position:relative;overflow:hidden;border-radius:20px;border:3px solid var(--bd);background:var(--pbg);color:var(--pfg);cursor:pointer;outline:none;transition:opacity .15s,border-color .15s,box-shadow .15s}
#p0{--pbg:#f4f0e6;--pfg:#191a1c;--bd:#d6d0c0;--low:#d64535}
#p1{--pbg:#1f2126;--pfg:#f2f2f2;--bd:#383b44;--low:#ff6b5b}
.panel:focus-visible{box-shadow:0 0 0 3px var(--acc)}
.in{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5cqh;position:relative}
@media (orientation:portrait){.flip #p1 .in{transform:rotate(180deg)}}
.lbl{font-size:min(4.4cqw,9cqh);letter-spacing:.22em;text-transform:uppercase;opacity:.65;font-weight:600}
.time{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:-.02em;line-height:1;font-size:min(calc(142cqw / var(--n,5)),36cqh);font-variant-numeric:tabular-nums;white-space:nowrap}
.sub{font-size:min(3.8cqw,7cqh);opacity:.7;min-height:1.3em}
@media (display-mode:fullscreen),(display-mode:standalone){:root{padding-bottom:max(env(safe-area-inset-bottom,0px),18px)}}
#app[data-st=run] .panel:not(.active),#app[data-st=pause] .panel:not(.active){opacity:.55}
#app[data-st=pause] .panel{opacity:.65}
.panel.active{border-color:var(--acc);box-shadow:0 0 0 4px rgba(88,194,94,.3),0 12px 40px -12px var(--acc)}
.panel.low .time{color:var(--low)}
.panel.low.active .time{animation:pu 1s steps(2,jump-none) infinite}
@keyframes pu{50%{opacity:.5}}
.panel.flag{background:#b8321f;color:#fff;border-color:#ff8a78}
.panel.flag .time{color:#fff}
.panel.win{border-color:var(--acc);box-shadow:0 0 0 4px rgba(88,194,94,.3)}
#bar{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:0}
@media (orientation:landscape){#bar{width:92px}}
#status{font-size:12px;color:var(--mut);text-align:center;font-weight:600;max-width:100%;min-height:1.3em}
.btns{display:flex;gap:10px;align-items:center}
@media (orientation:landscape){.btns{flex-direction:column;gap:8px}}
.ib{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--btn);display:grid;place-items:center;cursor:pointer;padding:0}
.ib:hover{border-color:var(--mut)}
.ib:disabled{opacity:.35;cursor:default}
.ib.pri{width:64px;height:64px;background:var(--acc);border-color:transparent;color:#fff}
.ib.cf{background:var(--bad);color:#fff;border-color:transparent}
.ib:focus-visible,.chip:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
@media (max-height:430px){.ib{width:38px;height:38px}.ib.pri{width:50px;height:50px}.btns{gap:5px!important}}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111c;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;z-index:9;backdrop-filter:blur(6px);text-align:center;max-width:90%}
#toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
dialog{border:1px solid var(--line);border-radius:18px;background:var(--card);color:var(--fg);padding:16px;width:min(460px,calc(100% - 20px));max-height:calc(100% - 20px);overflow:auto;user-select:text}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
dialog[open]{animation:dIn .38s cubic-bezier(.2,.9,.25,1)}
dialog[open]::backdrop{animation:bIn .3s ease-out}
dialog.out{animation:dOut .2s cubic-bezier(.4,0,1,1) forwards}
dialog.out::backdrop{animation:bOut .2s ease-in forwards}
@keyframes dIn{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes dOut{to{opacity:0;transform:translateY(16px) scale(.97)}}
@keyframes bIn{from{opacity:0}}
@keyframes bOut{to{opacity:0}}
@keyframes cIn{from{opacity:0;transform:translateY(8px) scale(.94)}}
@media (prefers-reduced-motion:reduce){dialog[open],dialog.out,dialog[open]::backdrop,dialog.out::backdrop,.chip{animation:none!important}}
.dh{display:flex;justify-content:space-between;align-items:center}
h2{margin:0;font-size:18px}h3{margin:16px 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.x{border:0;background:none;font-size:20px;cursor:pointer;padding:6px 10px}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.chip{border:1px solid var(--line);background:var(--btn);border-radius:12px;padding:8px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.chip{animation:cIn .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*20ms + 90ms)}
.chip b{font-size:15px}.chip small{font-size:10px;color:var(--mut)}
.chip.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut);font-weight:600}
.grid .full{grid-column:1/-1}
.grid label.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
input[type=number],select{font-size:16px;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--btn);width:100%;color:var(--fg)}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--acc)}
.act{margin-top:16px;display:flex;gap:8px}
.act button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--btn);cursor:pointer;font-weight:700}
.act .go{background:var(--acc);color:#fff;border-color:transparent}
.help{font-size:12px;color:var(--mut);margin:12px 0 0;line-height:1.5}
</style>
</head>
<body>
<div id="app" data-st="idle">
  <div class="panel" id="p1" role="button" tabindex="0" aria-label="Black clock"><div class="in"><div class="lbl">Black</div><div class="time">5:00</div><div class="sub"></div></div></div>
  <div id="bar">
    <div id="status" aria-hidden="true"></div>
    <div class="btns">
      <button class="ib" id="bU" aria-label="Undo last move" title="Undo (U)"></button>
      <button class="ib" id="bR" aria-label="Reset" title="Reset (R)"></button>
      <button class="ib pri" id="bP" aria-label="Start" title="Start / pause (Space)"></button>
      <button class="ib" id="bS" aria-label="Settings" title="Settings (S)"></button>
      <button class="ib" id="bM" aria-label="Sound" title="Sound (M)"></button>
    </div>
  </div>
  <div class="panel" id="p0" role="button" tabindex="0" aria-label="White clock"><div class="in"><div class="lbl">White</div><div class="time">5:00</div><div class="sub"></div></div></div>
</div>
<div id="toast"></div>
<div class="sr" id="live" aria-live="assertive"></div>

<dialog id="dlg" aria-labelledby="dt">
  <div class="dh"><h2 id="dt">Time control</h2><button class="x" id="dx" aria-label="Close">✕</button></div>
  <div class="pre" id="pre"></div>
  <h3>Custom</h3>
  <div class="grid">
    <label>Time per player (min)<input id="fmin" type="number" min="0.1" max="600" step="any" inputmode="decimal"></label>
    <label>Increment / delay (sec)<input id="finc" type="number" min="0" max="600" step="1" inputmode="numeric"></label>
    <label class="full">Increment type<select id="fmode"><option value="fischer">Fischer – added after each move</option><option value="bronstein">Bronstein – delay, time given back</option><option value="delay">Simple delay (US) – clock waits</option></select></label>
    <label class="chk full"><input type="checkbox" id="fdiff"> Different time for Black (handicap)</label>
    <label id="lm2" class="full">Black time (min)<input id="fmin2" type="number" min="0.1" max="600" step="any" inputmode="decimal"></label>
    
    <label>Bonus after move #<input id="fbm" type="number" min="0" max="200" step="1" inputmode="numeric"></label>
    <label>Bonus minutes<input id="fbmin" type="number" min="0" max="600" step="any" inputmode="decimal"></label>
  </div>
  <h3>Preferences</h3>
  <div class="grid">
    <label class="chk"><input type="checkbox" id="fsnd"> Sound</label>
    <label class="chk"><input type="checkbox" id="ffl"> Face-to-face</label>
    <label>Show tenths under<select id="ften"><option value="0">Never</option><option value="10">10 s</option><option value="20">20 s</option><option value="60">60 s</option></select></label>
    <label>Theme<select id="fth"><option value="auto">Auto</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
  </div>
  <div id="inst" hidden><h3>Install</h3><p class="help" id="ihelp" style="margin-top:0"></p><div class="act"><button id="ibtn" class="go">Install app</button><button id="ifs" type="button">Full screen</button></div></div>
  <div class="act"><button id="fc">Cancel</button><button id="fok" class="go">Start new game</button></div>
  <p class="help">Tap your side after moving. Keys: Space start/pause · Left Shift or A = White · Right Shift or L = Black · U undo · R reset · M mute. Face-to-face turns Black's side upside down in portrait.</p>
</dialog>

<script>
(()=>{
const $=s=>document.querySelector(s),pad=n=>String(n).padStart(2,'0');
const DEF={min:5,inc:3,mode:'fischer',diff:false,min2:5,bm:0,bmin:0,sound:true,flip:true,tenths:20,theme:'auto'};
let cfg={...DEF};
try{Object.assign(cfg,JSON.parse(localStorage.getItem('chessclock.v1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('chessclock.v1',JSON.stringify(cfg))}catch(e){}};
const PRE=[[1,0,'Bullet'],[2,1,'Bullet'],[3,0,'Blitz'],[3,2,'Blitz'],[5,0,'Blitz'],[5,3,'Blitz'],[10,0,'Rapid'],[10,5,'Rapid'],[15,10,'Rapid'],[30,0,'Classical'],[60,0,'Classical'],[90,30,'FIDE 40→+30m']];
const IC={
 play:'<polygon points="7 4 20 12 7 20" fill="currentColor"/>',
 pause:'<rect x="6" y="4" width="4" height="16" rx="1" fill="currentColor"/><rect x="14" y="4" width="4" height="16" rx="1" fill="currentColor"/>',
 undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/>',
 reset:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/>',
 set:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
 on:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 9a4 4 0 0 1 0 6M19 6.5a8 8 0 0 1 0 11"/>',
 off:'<path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l5 6M22 9l-5 6"/>'};
const ic=n=>`<svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;

const app=$('#app'),P=[0,1].map(i=>{const el=$('#p'+i);return{el,time:el.querySelector('.time'),sub:el.querySelector('.sub'),tx:'',sb:''}});
let S,hist=[],audioCtx,wl,toastT,rc=0,lastSt='',lastLive='';

/* ---------- audio / haptics / wake lock ---------- */
function actx(){if(!cfg.sound)return null;try{audioCtx=audioCtx||new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();return audioCtx}catch(e){return null}}
function beep(f,d,v,type,when){const a=actx();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(when||0);o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
const buzz=p=>{try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}};
async function wake(on){try{if(on&&!wl&&navigator.wakeLock){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null})}else if(!on&&wl){await wl.release();wl=null}}catch(e){wl=null}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&S.st==='run')wake(true)});

/* ---------- game logic ---------- */
function newGame(){
  const a=cfg.min*6e4,b=(cfg.diff?cfg.min2:cfg.min)*6e4;
  S={t:[a,b],init:[a,b],mv:[0,0],active:-1,st:'idle',loser:-1,turn:0,last:0,bs:-1};
  hist=[];wake(false);render()
}
const snap=()=>{hist.push({t:[...S.t],mv:[...S.mv],a:S.active,st:S.st,turn:S.turn});if(hist.length>500)hist.shift()};
function tick(){
  if(S.st!=='run')return;
  const now=performance.now(),dt=now-S.last,p=S.active;S.last=now;
  const D=cfg.mode==='delay'?cfg.inc*1e3:0,prev=S.turn;S.turn+=dt;
  S.t[p]-=D?Math.max(0,S.turn-D)-Math.max(0,prev-D):dt;
  if(S.t[p]<=0){S.t[p]=0;flag(p);return}
  const s=Math.ceil(S.t[p]/1e3);
  if(s<=10&&s!==S.bs){S.bs=s;beep(1250,.05,.07)}
}
function flag(p){
  S.st='over';S.loser=p;S.active=-1;wake(false);
  [0,1,2].forEach(i=>beep(1000,.22,.2,'square',i*.3));buzz([300,100,300,100,300]);render()
}
function start(){snap();S.st='run';S.active=0;S.turn=0;S.last=performance.now();S.bs=-1;wake(true);beep(520,.08,.12,'triangle');render()}
function press(p){
  tick();if(S.st!=='run'||S.active!==p)return;
  snap();
  if(cfg.mode==='fischer')S.t[p]+=cfg.inc*1e3;
  else if(cfg.mode==='bronstein')S.t[p]+=Math.min(S.turn,cfg.inc*1e3);
  S.mv[p]++;
  if(cfg.bm>0&&cfg.bmin>0&&S.mv[p]===cfg.bm){S.t[p]+=cfg.bmin*6e4;S.init[p]+=cfg.bmin*6e4;toast(`+${cfg.bmin} min added for ${p?'Black':'White'}`)}
  S.active=1-p;S.turn=0;S.last=performance.now();S.bs=-1;
  beep(p?660:880,.05,.13,'triangle');buzz(12);render()
}
function pause(){tick();if(S.st==='run'){S.st='pause';wake(false);render()}}
function resume(){if(S.st==='pause'){S.st='run';S.last=performance.now();wake(true);render()}}
function toggle(){actx();S.st==='idle'?start():S.st==='run'?pause():S.st==='pause'&&resume()}
function undo(){
  const h=hist.pop();if(!h)return;
  S.t=h.t;S.mv=h.mv;S.active=h.a;S.turn=h.turn;S.loser=-1;S.bs=-1;
  if(h.st==='idle'){S.st='idle';wake(false)}else{if(S.st!=='pause'){S.st='run';wake(true)}S.last=performance.now()}
  render()
}
function hit(i){actx();if(S.st==='idle')start();else if(S.st==='run'&&S.active===i)press(i);else if(S.st==='pause')toast('Paused – press play to resume')}

/* ---------- rendering ---------- */
function fmt(ms){
  const th=cfg.tenths*1e3;
  if(ms<=0)return th?'0.0':'0:00';
  if(th&&ms<th){const t=Math.ceil(ms/100);return Math.floor(t/10)+'.'+t%10}
  const s=Math.ceil(ms/1e3),h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  return h?`${h}:${pad(m)}:${pad(s%60)}`:`${m}:${pad(s%60)}`
}
const tag=()=>cfg.inc>0?(cfg.mode==='fischer'?`+${cfg.inc}s`:cfg.mode==='bronstein'?`${cfg.inc}s Bronstein`:`${cfg.inc}s delay`):'';
function render(){
  app.dataset.st=S.st;
  for(let i=0;i<2;i++){
    const p=P[i],c=p.el.classList,tx=fmt(S.t[i]);
    if(p.tx!==tx){p.tx=tx;p.time.textContent=tx;p.time.style.setProperty('--n',tx.length)}
    c.toggle('active',S.active===i);c.toggle('low',S.t[i]<1e4);c.toggle('flag',S.st==='over'&&S.loser===i);c.toggle('win',S.st==='over'&&S.loser!==i);
    let sb;
    if(S.st==='over')sb=S.loser===i?'Time out':'Wins on time';
    else if(S.st==='pause'&&S.active===i)sb='Paused';
    else sb='Moves '+S.mv[i]+(tag()?' · '+tag():'');
    if(p.sb!==sb){p.sb=sb;p.sub.textContent=sb}
  }
  const st=S.st==='idle'?'Tap anywhere to start White’s clock':S.st==='run'?(S.active?'Black':'White')+' to move':S.st==='pause'?'Paused':(S.loser?'White':'Black')+' wins on time';
  if(st!==lastSt){lastSt=st;$('#status').textContent=st;if(S.st==='over'||S.st==='pause')$('#live').textContent=st}
  const bp=$('#bP'),pl=S.st==='run';
  const pk=pl?'pause':'play';if(bp.dataset.k!==pk){bp.dataset.k=pk;bp.innerHTML=ic(pk);bp.setAttribute('aria-label',pl?'Pause':S.st==='pause'?'Resume':'Start')}
  bp.disabled=S.st==='over';$('#bU').disabled=!hist.length;
}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2200)}
function prefs(){
  const r=document.documentElement;cfg.theme==='auto'?r.removeAttribute('data-theme'):r.dataset.theme=cfg.theme;
  document.body.classList.toggle('flip',cfg.flip);$('#bM').innerHTML=ic(cfg.sound?'on':'off');$('#bM').setAttribute('aria-pressed',String(cfg.sound))
}

/* ---------- settings dialog ---------- */
const dlg=$('#dlg'),F=id=>$('#'+id),num=(id,lo,hi,d)=>{const v=parseFloat(F(id).value);return isFinite(v)?Math.min(hi,Math.max(lo,v)):d};
function buildPre(){
  $('#pre').innerHTML=PRE.map((p,i)=>`<button class="chip${cfg.min===p[0]&&cfg.inc===p[1]&&cfg.mode==='fischer'&&!cfg.diff&&(p[0]===90?cfg.bm===40:!cfg.bm)?' on':''}" data-i="${i}" style="--i:${i}"><b>${p[0]}+${p[1]}</b><small>${p[2]}</small></button>`).join('')
}
function fill(){
  F('fmin').value=cfg.min;F('finc').value=cfg.inc;F('fmode').value=cfg.mode;F('fdiff').checked=cfg.diff;F('fmin2').value=cfg.min2;
  F('fbm').value=cfg.bm;F('fbmin').value=cfg.bmin;F('fsnd').checked=cfg.sound;F('ffl').checked=cfg.flip;F('ften').value=cfg.tenths;F('fth').value=cfg.theme;
  $('#lm2').style.display=cfg.diff?'':'none';buildPre()
}
function openSet(){pause();fill();updInst();dlg.classList.remove('out');dlg.showModal();dlg.scrollTop=0}
function closeDlg(){
  if(!dlg.open||dlg.classList.contains('out'))return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches){dlg.close();return}
  dlg.classList.add('out');setTimeout(()=>{dlg.classList.remove('out');dlg.close()},200)
}
function apply(){
  cfg.min=num('fmin',.1,600,5);cfg.inc=Math.round(num('finc',0,600,0));cfg.mode=F('fmode').value;cfg.diff=F('fdiff').checked;
  cfg.min2=num('fmin2',.1,600,cfg.min);cfg.bm=Math.round(num('fbm',0,200,0));cfg.bmin=num('fbmin',0,600,0);
  cfg.sound=F('fsnd').checked;cfg.flip=F('ffl').checked;cfg.tenths=+F('ften').value;cfg.theme=F('fth').value;
  save();prefs();closeDlg();newGame()
}
$('#pre').addEventListener('click',e=>{
  const b=e.target.closest('.chip');if(!b)return;const p=PRE[+b.dataset.i];
  F('fmin').value=p[0];F('finc').value=p[1];F('fmode').value='fischer';F('fdiff').checked=false;$('#lm2').style.display='none';
  F('fbm').value=p[0]===90?40:0;F('fbmin').value=p[0]===90?30:0;
  $('#pre').querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b))
});
F('fdiff').onchange=()=>{$('#lm2').style.display=F('fdiff').checked?'':'none'};
$('#fok').onclick=apply;$('#fc').onclick=$('#dx').onclick=closeDlg;
dlg.addEventListener('click',e=>{if(e.target!==dlg)return;const r=dlg.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)closeDlg()});
dlg.addEventListener('cancel',e=>{e.preventDefault();closeDlg()});

/* ---------- input ---------- */
P.forEach((p,i)=>{
  p.el.addEventListener('pointerdown',e=>{if(e.button)return;e.preventDefault();hit(i)});
  p.el.addEventListener('keydown',e=>{if(e.code==='Enter'||e.code==='Space'){e.preventDefault();e.stopPropagation();hit(i)}})
});
$('#bP').onclick=toggle;$('#bU').onclick=undo;$('#bS').onclick=openSet;
$('#bM').onclick=()=>{cfg.sound=!cfg.sound;save();prefs();toast(cfg.sound?'Sound on':'Sound off')};
$('#bR').onclick=()=>{
  const b=$('#bR');
  if(S.st==='idle'||S.st==='over'||rc){clearTimeout(rc);rc=0;b.classList.remove('cf');newGame();return}
  b.classList.add('cf');toast('Tap reset again to confirm');rc=setTimeout(()=>{rc=0;b.classList.remove('cf')},2500)
};
addEventListener('keydown',e=>{
  if(dlg.open||e.repeat||e.ctrlKey||e.metaKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
  const c=e.code;
  if(c==='ShiftLeft'||c==='KeyA')hit(0);
  else if(c==='ShiftRight'||c==='KeyL')hit(1);
  else if((c==='Space'||c==='Enter')&&e.target.tagName!=='BUTTON'){e.preventDefault();toggle()}
  else if(c==='KeyU')undo();
  else if(c==='KeyR')$('#bR').click();
  else if(c==='KeyM')$('#bM').click();
  else if(c==='KeyS')openSet();
});
$('#bU').innerHTML=ic('undo');$('#bR').innerHTML=ic('reset');$('#bS').innerHTML=ic('set');
document.addEventListener('contextmenu',e=>e.preventDefault());
/* ---------- PWA install ---------- */
let dip=null;
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function icon(n){
  const c=document.createElement('canvas');c.width=c.height=n;const x=c.getContext('2d'),u=n/512;
  const r=(a,b,w,h,rad,f)=>{x.fillStyle=f;x.beginPath();x.roundRect(a*u,b*u,w*u,h*u,rad*u);x.fill()};
  r(0,0,512,512,0,'#0d0e11');r(56,56,400,180,44,'#1f2126');r(56,276,400,180,44,'#f4f0e6');r(56,248,400,16,8,'#58c25e');
  r(240,100,32,32,16,'#f4f0e6');r(240,156,32,32,16,'#f4f0e6');r(240,320,32,32,16,'#1f2126');r(240,376,32,32,16,'#1f2126');
  return c.toDataURL('image/png')
}
function setupPWA(){
  try{
    const link=(rel,href,sz)=>{const l=document.createElement('link');l.rel=rel;l.href=href;if(sz)l.sizes=sz;document.head.appendChild(l)};
    const i192=icon(192),i512=icon(512),base=location.href.split('#')[0];
    link('icon',i192);link('apple-touch-icon',icon(180),'180x180');
    const m={name:'Chess Clock',short_name:'Chess Clock',description:'Professional chess clock',display:'standalone',orientation:'any',background_color:'#0d0e11',theme_color:'#0d0e11',start_url:base,scope:base.replace(/[^/]*$/,''),icons:[{src:i192,sizes:'192x192',type:'image/png',purpose:'any'},{src:i512,sizes:'512x512',type:'image/png',purpose:'any'}]};
    link('manifest',URL.createObjectURL(new Blob([JSON.stringify(m)],{type:'application/manifest+json'})))
  }catch(e){}
  if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
    navigator.serviceWorker.register('sw.js').then(()=>navigator.serviceWorker.ready).then(()=>caches.open('chess-clock-v1')).then(c=>c.add(location.href)).catch(()=>{})
  }
}
function updInst(){
  const box=$('#inst');if(standalone()){box.hidden=true;return}
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  box.hidden=false;$('#ibtn').hidden=!dip;$('#ifs').hidden=!document.documentElement.requestFullscreen;
  $('#ihelp').textContent=dip?'Install Chess Clock for a full-screen, offline-ready app.':ios?'On iPhone or iPad: tap Share, then “Add to Home Screen”.':location.protocol==='file:'?'Browsers block installing from a local file. Serve this file and sw.js over https or localhost (for example: python3 -m http.server), then reopen it.':'Use your browser menu (“Install app” or “Add to Home Screen”) to install.'
}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dip=e;updInst()});
addEventListener('appinstalled',()=>{dip=null;updInst();toast('Installed')});
$('#ifs').onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}closeDlg()};
$('#ibtn').onclick=async()=>{if(!dip)return;dip.prompt();try{await dip.userChoice}catch(e){}dip=null;updInst()};
setupPWA();
prefs();newGame();
setInterval(()=>{if(S.st==='run'){tick();render()}},50);
})();
</script>
</body>
</html>
